name: appflowy_monorepo
description: AppFlowy Flutter Monorepo - 1:1 Ground-Truth REA Replication of AppFlowy
version: 0.11.4
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"

workspace:
  - apps/appflowy
  - packages/appflowy_backend
  - packages/appflowy_popover
  - packages/appflowy_result
  - packages/appflowy_ui
  - packages/flowy_infra
  - packages/flowy_infra_ui
  - packages/flowy_svg

dev_dependencies:
  melos: ^8.10.0

dependency_overrides:
  intl: ^0.20.2

melos:
  command:
    bootstrap:
      usePubspecOverrides: true
  scripts:
    analyze:
      run: melos exec -- flutter analyze .
      description: Run `flutter analyze` in all packages.
    format:
      run: melos exec -- dart format .
      description: Run `dart format` in all packages.
    test:
      run: melos exec --dir-exists="test" -- flutter test
      description: Run `flutter test` in all packages that have a test directory.
    clean:
      run: melos exec -- flutter clean
      description: Run `flutter clean` in all packages.
    get:
      run: melos exec -- flutter pub get
      description: Run `flutter pub get` in all packages.
    run:windows:
      run: cd apps/appflowy && flutter run -d windows
      description: Run AppFlowy desktop on Windows.
    run:macos:
      run: cd apps/appflowy && flutter run -d macos
      description: Run AppFlowy desktop on macOS.
    run:linux:
      run: cd apps/appflowy && flutter run -d linux
      description: Run AppFlowy desktop on Linux.
    run:web:
      run: cd apps/appflowy && flutter run -d chrome
      description: Run AppFlowy on Chrome Web.
    run:android:
      run: cd apps/appflowy && flutter run -d android
      description: Run AppFlowy on Android.
    run:ios:
      run: cd apps/appflowy && flutter run -d ios
      description: Run AppFlowy on iOS.
